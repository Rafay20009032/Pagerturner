<!DOCTYPE html>
<html lang="en"> 
<head>
    <title>Login - Web Panel</title>
    
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Page Of Web Panel - Page Turner">
    <meta name="author" content="Muhammad Rafay">    
    <link rel="shortcut icon" href="favicon.ico"> 
    
    <!-- FontAwesome JS-->
    <script defer src="assets/plugins/fontawesome/js/all.min.js"></script>
    
    <!-- App CSS -->  
    <link id="theme-style" rel="stylesheet" href="assets/css/portal.css">
</head> 

<body class="app app-login p-0">    	
    <div class="row g-0 app-auth-wrapper">
	    <div class="col-12 col-md-7 col-lg-6 auth-main-col text-center p-5">
		    <div class="d-flex flex-column align-content-end">
			    <div class="app-auth-body mx-auto">	
					<h2 style="color: #631d04; margin-top: 25%;" class="auth-heading text-center mb-5"><b>Log in to Web Panel</b></h2>
			        <div class="auth-form-container text-start">
						<form class="auth-form login-form" id="login-form" method="POST" enctype="multipart/form-data" action="methods.php">  
                            <input type="hidden" name="form_action" value="login">       
							<div class="email mb-3">
								<label class="sr-only" for="signin-email">Email</label>
								<input id="signin-email" name="signin-email" type="email" class="form-control signin-email" placeholder="Email address" required="required">
							</div><!--//form-group-->
							<div class="email mb-3">
								<label class="sr-only" for="signin-password">Password</label>
								<input id="signin-password" name="signin-password" type="password" class="form-control signin-password" placeholder="Password" required="required">
							</div><!--//form-group-->
							
							<div class="text-center">
								<button type="submit" style="background-color: #631d04;" class="btn app-btn-primary w-100 theme-btn mx-auto">Log In</button>
							</div>

                            <div class="text-center mt-3">
                                <p class="small">Don't have an account? <a href="signup.html" class="text-primary">Sign up here</a></p>
                            </div>
						</form>
                        <!-- Error Message -->
                        <div id="error-message" style="display: none; color: red; margin-top: 10px;">Invalid email or password.</div>
					</div><!--//auth-form-container-->	
			    </div><!--//auth-body-->	
		    </div><!--//flex-column-->   
	    </div><!--//auth-main-col-->
	    <div class="col-12 col-md-5 col-lg-6 h-100 auth-background-col">
		    <div class="auth-background-holder">
		    </div>
		    <div class="auth-background-mask"></div>
		    <div class="auth-background-overlay p-3 p-lg-5">
			    <div class="d-flex flex-column align-content-end h-100">
				    <div class="h-100"></div>
				</div>
		    </div><!--//auth-background-overlay-->
	    </div><!--//auth-background-col-->
    </div><!--//row-->

</body>
</html>
